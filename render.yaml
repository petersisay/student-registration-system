services:
  - type: web
    name: bule-hora-elementary-school
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: student_db
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
